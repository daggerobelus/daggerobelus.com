# ratchet-loop (PLAIN arm) — Sedley CER optimization, head-to-head vs forum
# Pinned Phase-0 setup contract. Identical to forum/config.yaml EXCEPT the
# strategy.credit / review blocks — that delta is the variable under test.

objective:
  # For a given candidate method.md: transcribe the 13 val pages BLIND (image only,
  # no reference), write hyp/page-XXX.txt, then run the sealed scorer.
  protocol: "python3 skills/manuscript-autoresearch-run/scripts/score.py --splits-root ingest/archive/test/ratchet-headtohead-01 --split val --hyp-dir <CANDIDATE>/hyp"
  replicates: 2          # baseline re-measured with 2 transcription replicates/round -> noise band (sigma)
  metrics:
    - { name: diplomatic_cer, direction: minimize, weight: 1.0, role: primary }
    - { name: reading_cer,    direction: minimize, role: floor, floor_tolerance: 0.03 }
  composite: primary_metric   # diplomatic_cer is the rank key; reading_cer is a guard floor
  normalize: none             # CER is already a 0..1 rate, comparable across rounds

mode: specialist        # tuning a method to THIS scribe (Lady Sedley MS534) is the goal

gates:                  # fail any -> candidate ineligible regardless of CER
  - { name: all_pages_present,   check: "13/13 val hyp files non-empty" }
  - { name: reading_cer_floor,   check: "reading_cer must not regress past baseline + 0.03" }
  - { name: no_memorized_refs,   check: "method.md contains no verbatim reference lines (specialist degeneracy guard)" }

surfaces:
  mutable: ["<arm>/rounds/**/method.md"]   # ONLY the transcription method may change
  frozen:  [                               # tamper here -> disqualified:tamper, not scored
    "skills/manuscript-autoresearch-run/scripts/score.py",
    "skills/manuscript-evaluation/**",
    "ingest/archive/test/ratchet-headtohead-01/corpus/**",
    "ingest/archive/test/ratchet-headtohead-01/splits.json",
    "ingest/archive/test/ratchet-headtohead-01/**/config.yaml",
    "ingest/archive/test/ratchet-headtohead-01/**/ledger.jsonl"
  ]

evaluation:
  dev_set: "val"                    # the loop optimizes against val
  holdout_set: "test"              # never seen during proposing; confirmation only
  holdout_sampling: same_distribution   # specialist: same hand, unseen pages -> catches memorization
  confirm_on_holdout: every_promotion

topology: single_lineage

strategy:
  active_set_size: 6
  universe: [refine, tune, restructure, subtract, generative, first_principles, cross_pollinate, wildcard]
  growable: true
  credit: yield_tally            # PLAIN: per-archetype win/loss counter
  initial_mix: { refine: 2, tune: 1, subtract: 1, first_principles: 1, cross_pollinate: 1 }

review:
  mode: none                     # PLAIN: no challenger, no human. Metric + confirmation only.

goal:
  season_target: { diplomatic_cer: 0.10 }   # provisional; real goal is "as low as possible"
  season_round_budget: 10

budgets:
  fanout: 6
  max_rounds: 10
  candidate_timeout_s: 900

exit_criteria:
  target: { diplomatic_cer: 0.08 }   # optional stretch
  plateau_patience: 3                # 3 rounds with no promotion (after exploration escalates) -> stop
  epsilon: 0.005                     # a CER drop below this is convergence noise, not a win

baseline:
  start_mode: naive
  naive_method: "Transcribe this manuscript page. Produce a semi-diplomatic transcription."
